<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Download</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #ffffff;
      --bg-surface: #f5f5f3;
      --bg-success: #eaf3de;
      --text: #1a1a18;
      --text-muted: #5f5e5a;
      --text-hint: #888780;
      --text-success: #3b6d11;
      --border: rgba(0,0,0,0.12);
      --border-hover: rgba(0,0,0,0.25);
      --border-success: rgba(59,109,17,0.35);
      --radius-md: 8px;
      --radius-lg: 12px;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1c1a;
        --bg-surface: #2a2a28;
        --bg-success: #173404;
        --text: #ededea;
        --text-muted: #b4b2a9;
        --text-hint: #888780;
        --text-success: #97c459;
        --border: rgba(255,255,255,0.12);
        --border-hover: rgba(255,255,255,0.25);
        --border-success: rgba(151,196,89,0.35);
      }
    }

    body {
      font-family: var(--font);
      background: var(--bg-surface);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      color: var(--text);
    }

    .wrap { width: 100%; max-width: 400px; }

    .icon-wrap {
      width: 64px; height: 64px; border-radius: 50%;
      background: var(--bg); border: 0.5px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 1.25rem;
    }
    .icon-wrap i { font-size: 28px; color: var(--text-muted); }

    h1 { font-size: 20px; font-weight: 500; text-align: center; margin-bottom: 6px; }
    .sub { font-size: 14px; color: var(--text-muted); text-align: center; margin-bottom: 1.75rem; line-height: 1.5; }

    .card {
      background: var(--bg);
      border: 0.5px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1.5rem;
    }

    .file-row {
      display: flex; align-items: center; gap: 12px;
      padding-bottom: 1.25rem; margin-bottom: 1.25rem;
      border-bottom: 0.5px solid var(--border);
    }
    .file-icon {
      width: 40px; height: 40px; flex-shrink: 0;
      border-radius: var(--radius-md);
      background: var(--bg-surface); border: 0.5px solid var(--border);
      display: flex; align-items: center; justify-content: center;
    }
    .file-icon i { font-size: 18px; color: var(--text-muted); }
    .file-name { font-size: 14px; font-weight: 500; }
    .file-meta { font-size: 12px; color: var(--text-hint); margin-top: 2px; }

    .dl-btn {
      width: 100%;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      padding: 10px 16px;
      font-size: 14px; font-weight: 500; font-family: var(--font);
      cursor: pointer;
      background: var(--bg);
      border: 0.5px solid var(--border-hover);
      border-radius: var(--radius-md);
      color: var(--text);
      transition: background 0.15s, transform 0.1s;
    }
    .dl-btn:hover:not(:disabled) { background: var(--bg-surface); }
    .dl-btn:active:not(:disabled) { transform: scale(0.98); }
    .dl-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .dl-btn i { font-size: 16px; }

    .msg {
      margin-top: 12px; font-size: 13px; text-align: center;
      border-radius: var(--radius-md); padding: 8px 12px;
      display: none; line-height: 1.4;
    }
    .msg.success {
      display: block;
      background: var(--bg-success); color: var(--text-success);
      border: 0.5px solid var(--border-success);
    }

    footer { text-align: center; margin-top: 1.5rem; font-size: 12px; color: var(--text-hint); }
  </style>
</head>
<body>

<div class="wrap">
  <div class="icon-wrap"><i class="ti ti-download" aria-hidden="true"></i></div>
  <h1>Download file</h1>
  <p class="sub">Click the button below to download.</p>

  <div class="card">
    <div class="file-row">
      <div class="file-icon"><i class="ti ti-file-zip" aria-hidden="true"></i></div>
      <div>
        <!-- ✏️ Change display name and size here -->
        <div class="file-name">VestaBags.pptx</div>
        <div class="file-meta">2.4 MB · Proiect PPTX</div>
      </div>
    </div>

    <button class="dl-btn" id="dlBtn">
      <i class="ti ti-download" aria-hidden="true"></i> Download
    </button>

    <div class="msg" id="msg" role="alert"></div>
  </div>

  <footer>Hosted on GitHub Pages</footer>
</div>

<script>
  // ✏️ Set the file URL and download name
  const FILE_URL  = "VestaBags.pptx";
  const FILE_NAME = "VestaBags.pptx";

  document.getElementById("dlBtn").addEventListener("click", function () {
    const btn = this;
    const msg = document.getElementById("msg");

    btn.disabled = true;
    btn.innerHTML = '<i class="ti ti-loader" aria-hidden="true"></i> Starting…';

    const a = document.createElement("a");
    a.href = FILE_URL;
    a.download = FILE_NAME;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);

    msg.className = "msg success";
    msg.textContent = "✓ Download started!";

    setTimeout(() => {
      btn.disabled = false;
      btn.innerHTML = '<i class="ti ti-download" aria-hidden="true"></i> Download again';
    }, 3000);
  });
</script>

</body>
</html>
