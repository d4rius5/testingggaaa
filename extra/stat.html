<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Photo</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0d0d;
      --text: #ededea;
      --text-muted: #888780;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem 1rem;
      color: var(--text);
    }

    .img-wrap {
      width: 100%;
      max-width: 860px;
      position: relative;
    }

    img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 10px;
      object-fit: contain;
    }

    .caption {
      margin-top: 14px;
      font-size: 14px;
      color: var(--text-muted);
      text-align: center;
      line-height: 1.5;
    }

    /* Lightbox */
    #lb {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.92);
      z-index: 999;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      cursor: zoom-out;
    }
    #lb.open { display: flex; }
    #lb img {
      max-width: 100%;
      max-height: 90vh;
      border-radius: 6px;
      object-fit: contain;
      cursor: default;
    }
    #lb-close {
      position: fixed;
      top: 16px; right: 20px;
      font-size: 28px;
      color: #fff;
      background: none;
      border: none;
      cursor: pointer;
      line-height: 1;
      opacity: 0.7;
    }
    #lb-close:hover { opacity: 1; }

    img.clickable { cursor: zoom-in; }
  </style>
</head>
<body>

  <div class="img-wrap">
    <!-- ✏️ Change src to your image path, and alt/caption to describe it -->
    <img
      id="main-img"
      src="stat.jpeg"
      alt="Your photo"
      class="clickable"
      onclick="openLightbox(this.src)"
    />
    <p class="caption">Your caption here · Click to enlarge</p>
  </div>

  <div id="lb" onclick="closeLightbox()">
    <button id="lb-close" onclick="closeLightbox()" aria-label="Close">✕</button>
    <img id="lb-img" src="" alt="Enlarged view" onclick="event.stopPropagation()" />
  </div>

  <script>
    function openLightbox(src) {
      document.getElementById("lb-img").src = src;
      document.getElementById("lb").classList.add("open");
      document.body.style.overflow = "hidden";
    }
    function closeLightbox() {
      document.getElementById("lb").classList.remove("open");
      document.body.style.overflow = "";
    }
    document.addEventListener("keydown", e => {
      if (e.key === "Escape") closeLightbox();
    });
  </script>

</body>
</html>
